name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          black --check .
          sqlfluff lint infra
      - name: Unit tests
        run: pytest -q

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env && docker compose --profile all --profile sim config -q

  spark-tests:
    # Runs the Spark tests in the same image the pipeline uses, so CI matches local exactly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose build spark-bronze
      - run: docker compose run --rm --no-deps spark-bronze python3 -m pytest -q -p no:cacheprovider tests
