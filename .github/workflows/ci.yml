name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          black --check .
          sqlfluff lint infra
      - name: Unit tests
        run: pytest -q

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env && docker compose --profile all --profile sim config -q

  spark-tests:
    # Runs the Spark tests in the same image the pipeline uses, so CI matches local exactly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose build spark-bronze
      - run: docker compose run --rm --no-deps spark-bronze python3 -m pytest -q -p no:cacheprovider tests

  airflow-dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Airflow (pinned with its constraints file)
        run: >
          pip install "apache-airflow[docker,postgres]==2.10.4" pytest
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.4/constraints-3.11.txt
      - name: DAG integrity tests
        run: |
          airflow db migrate >/dev/null
          pytest -q -p no:cacheprovider tests/airflow
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
          PYTHONPATH: ${{ github.workspace }}/airflow/dags

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/local
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  dbt-ci:
    # dbt "Slim CI": on a PR, build only modified models plus their parents and children,
    # compared with main's manifest, in a throwaway Postgres seeded with a fixture slice.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: analytics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_PROFILES_DIR: .
      WH_PGHOST: localhost
      WH_PGPORT: "5432"
      PGPASSWORD: warehouse
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install dbt-core==1.8.9 dbt-postgres==1.8.2 "dbt-metricflow[dbt-postgres]==0.7.1"
      - name: Seed the throwaway warehouse
        run: |
          psql -h localhost -U warehouse -d analytics -q -v ON_ERROR_STOP=1 -f ../infra/postgres-wh/init/01_schemas.sql
          psql -h localhost -U warehouse -d analytics -q -v ON_ERROR_STOP=1 -f ci/silver_fixture.sql
      - run: dbt deps
      - name: Validate the semantic layer
        run: dbt parse && mf validate-configs --skip-dw
      - name: Fetch main's manifest (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" -w ci -b main -s success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$run_id" ] && gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n dbt-manifest -D prod-state; then
            echo "STATE_FLAGS=--select +state:modified+ --state prod-state" >> "$GITHUB_ENV"
          else
            echo "No main manifest yet; building everything."
          fi
      - name: dbt build
        run: dbt build $STATE_FLAGS
      - name: Keep main's manifest for future PRs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest
          path: dbt/target/manifest.json
          retention-days: 90

  integration:
    # Compose up the real stack, push 1,000 events, assert they land correctly in the marts.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint-and-test, spark-tests]
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - name: Start the core stack and the warehouse
        run: |
          docker compose --profile core up -d --wait --build
          docker compose --profile wh up -d --wait postgres-wh
      - name: Register the CDC connector
        run: ./scripts/register_connector.sh
      - name: Run the integration test
        run: ./tests/integration/run.sh
      - name: Logs on failure
        if: failure()
        run: |
          docker compose --profile core --profile wh ps
          for s in connect spark-bronze spark-silver; do echo "=== $s"; docker compose logs --tail 80 $s; done
