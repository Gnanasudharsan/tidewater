name: dbt-docs

# Publishes the dbt docs site (lineage graph, model and column docs, tests) to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["dbt/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # docs generate needs a connection for introspection; an empty warehouse is enough.
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: analytics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_PROFILES_DIR: .
      WH_PGHOST: localhost
      WH_PGPORT: "5432"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install dbt-core==1.8.9 dbt-postgres==1.8.2
      - run: dbt deps
      - run: dbt docs generate --static
      - run: mkdir -p site && cp target/static_index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
