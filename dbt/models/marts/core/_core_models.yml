version: 2

models:
  - name: dim_customer
    description: >
      SCD Type 2 customer dimension built from the snap_customers snapshot. One row
      per customer version; valid_from/valid_to are half-open [from, to).
    columns:
      - name: customer_sk
        description: Surrogate key for one customer version.
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]

  - name: dim_product
    description: Current product attributes (Type 1).
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_date
    description: Calendar from 2026-01-01 to 2027-12-31.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          value: 730

  - name: fct_orders
    description: >
      Order grain. Incremental (merge on order_id); rebuilt for any order whose
      row, lines, or payments changed; soft-deleted orders removed by post-hook.
    data_tests:
      # Row-count delta check: every live order is in the fact, and nothing else.
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: ref('stg_orders')
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_sk
        description: Customer version valid at ordered_at (SCD2 as-of join).
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_sk}
      - name: order_total
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100000
      - name: refunded_amount
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: customer_order_number
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1

  - name: fct_order_items
    description: Order-line grain with the price actually paid.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: ref('stg_order_items')
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships: {to: ref('fct_orders'), field: order_id}
      - name: product_id
        data_tests:
          - relationships: {to: ref('dim_product'), field: product_id}

  - name: fct_payments
    description: Payment grain; refunds are negative amounts.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: ref('stg_payments')
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships: {to: ref('fct_orders'), field: order_id}

  - name: fct_daily_sales
    description: Day grain sales rollup (GMV, AOV, units, refunds, repeat orders).
    columns:
      - name: order_date
        data_tests: [unique, not_null]
      - name: gmv
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between: {min_value: 0}
      - name: aov
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 20000

  - name: customer_order_summary
    description: Customer grain lifetime stats; feeds the repeat-customer-rate metric.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: order_count
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between: {min_value: 1}

  - name: metricflow_time_spine
    description: Day spine required by MetricFlow.
