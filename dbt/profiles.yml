# Credentials come from the environment; nothing secret lives in the repo.
tidewater:
  target: "{{ env_var('DBT_TARGET', 'postgres') }}"
  outputs:
    postgres:
      type: postgres
      host: "{{ env_var('WH_PGHOST', 'localhost') }}"
      port: "{{ env_var('WH_PGPORT', '5434') | int }}"
      user: "{{ env_var('WH_PGUSER', 'warehouse') }}"
      password: "{{ env_var('WH_PGPASSWORD', 'warehouse') }}"
      dbname: "{{ env_var('WH_PGDATABASE', 'analytics') }}"
      schema: public
      threads: 4
    # Week 9 benchmarks: the same models with `--target snowflake` (key-pair auth).
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'unset') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'SVC_TIDEWATER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '/secrets/snowflake_key.p8') }}"
      role: TIDEWATER_TRANSFORMER
      warehouse: TIDEWATER_WH
      database: TIDEWATER
      schema: PUBLIC
      threads: 8
      query_tag: tidewater-dbt
