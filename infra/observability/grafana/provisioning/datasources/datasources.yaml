apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Warehouse
    uid: warehouse
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres-wh:5432
    user: $WH_PG_USER
    jsonData:
      database: $WH_PG_DB
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $WH_PG_PASSWORD
