global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: streams
    static_configs:
      - targets: ["spark-bronze:9108"]
        labels: {stream: bronze}
      - targets: ["spark-silver:9108"]
        labels: {stream: silver}
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
