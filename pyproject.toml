[project]
name = "tidewater"
version = "0.1.0"
description = "CDC lakehouse: Postgres -> Debezium -> Kafka -> Spark/Delta -> dbt, with provable exactly-once results."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tidewater_sim", "tidewater_spark", "tidewater_ops"]
known-third-party = ["airflow"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["simulator", "spark"]
