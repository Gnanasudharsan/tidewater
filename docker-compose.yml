# Tidewater local stack. Services are grouped into profiles so an 8 GB laptop
# never runs everything at once. See the Makefile for `make up-core` etc.

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  # ---------------------------------------------------------------- core
  postgres-src:
    image: postgres:16.4
    profiles: ["core", "all"]
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=2GB
    environment:
      POSTGRES_USER: ${SRC_PG_USER}
      POSTGRES_PASSWORD: ${SRC_PG_PASSWORD}
      POSTGRES_DB: ${SRC_PG_DB}
    ports: ["5432:5432"]
    volumes:
      - pg-src-data:/var/lib/postgresql/data
      - ./infra/postgres-src/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SRC_PG_USER} -d ${SRC_PG_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging

  kafka:
    image: apache/kafka:3.7.1
    profiles: ["core", "all"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk  # base64 of a 16-byte UUID (KRaft requirement)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
      # Without this the image writes to /tmp inside the container and the volume
      # below is never used: recreating the container wipes every topic.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["29092:29092"]
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 20
    restart: unless-stopped
    mem_limit: 1536m
    logging: *default-logging

  schema-registry:
    # Apicurio with KafkaSQL storage: schemas (and their IDs) survive restarts.
    image: apicurio/apicurio-registry-kafkasql:2.6.2.Final
    profiles: ["core", "all"]
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: -Xmx384m
    ports: ["8081:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health/ready >/dev/null"]
      interval: 10s
      retries: 30
    restart: unless-stopped
    mem_limit: 640m
    logging: *default-logging

  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    profiles: ["core", "all"]
    depends_on:
      kafka: { condition: service_healthy }
      postgres-src: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: tidewater-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      ENABLE_APICURIO_CONVERTERS: "true"
      HEAP_OPTS: -Xms256m -Xmx768m
    ports: ["8083:8083"]
    volumes:
      - ./connect:/tidewater/connect:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/ >/dev/null"]
      interval: 10s
      retries: 30
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["core", "all"]
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: tidewater
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8080/apis/ccompat/v7
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      JAVA_OPTS: -Xmx256m
    ports: ["8080:8080"]
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging

  object-store:
    # SeaweedFS S3 gateway. MinIO stopped publishing free images (see ADR 0006).
    # Spark talks plain S3A to it, so moving to AWS S3 is an endpoint change.
    image: chrislusf/seaweedfs:4.00
    profiles: ["core", "all"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"tidewater","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -ip=object-store -ip.bind=0.0.0.0 -volume.max=0 \
          -volume.index=leveldb -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports: ["8333:8333", "8888:8888"]
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status && wget -q -O /dev/null http://localhost:8333/healthz"]
      interval: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 1536m
    logging: *default-logging

  object-store-init:
    # One-shot bucket bootstrap. Terraform takes this over in week 7.
    image: chrislusf/seaweedfs:4.00
    profiles: ["core", "all"]
    depends_on:
      object-store: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo "s3.bucket.create -name ${LAKEHOUSE_BUCKET}" | weed shell -master=object-store:9333 && echo "s3.bucket.list" | weed shell -master=object-store:9333
    restart: "no"

  spark-bronze:
    # Kafka -> bronze Delta stream. Checkpoint lives in S3, so the container is stateless.
    build: ./spark
    image: tidewater-spark:local
    profiles: ["core", "all"]
    depends_on:
      kafka: { condition: service_healthy }
      object-store-init: { condition: service_completed_successfully }
    environment: &spark-env
      S3_ENDPOINT_INTERNAL: http://object-store:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET}
      KAFKA_BOOTSTRAP: kafka:9092
      BRONZE_TRIGGER: ${BRONZE_TRIGGER:-5 seconds}
      BRONZE_TXN_APP_ID: ${BRONZE_TXN_APP_ID:-bronze_cdc_v1}
      BRONZE_CHAOS_CRASH_AFTER_COMMIT: ${BRONZE_CHAOS_CRASH_AFTER_COMMIT:-0}
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
      SILVER_TRIGGER: ${SILVER_TRIGGER:-10 seconds}
      SILVER_TXN_APP_ID: ${SILVER_TXN_APP_ID:-silver_v1}
      PGHOST: postgres-src
      PGPORT: 5432
      PGDATABASE: ${SRC_PG_DB}
      PGUSER: ${SRC_PG_USER}
      PGPASSWORD: ${SRC_PG_PASSWORD}
      WH_PGHOST: postgres-wh
      WH_PGPORT: 5432
      WH_PGDATABASE: ${WH_PG_DB}
      WH_PGUSER: ${WH_PG_USER}
      WH_PGPASSWORD: ${WH_PG_PASSWORD}
      OPENLINEAGE_URL: ${OPENLINEAGE_URL:-}
      SILVER_MERGE_PARALLELISM: ${SILVER_MERGE_PARALLELISM:-1}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_SERVICE_USER:-SVC_TIDEWATER}
      SNOWFLAKE_PRIVATE_KEY_PATH: /secrets/snowflake_key.p8
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 900m
      - jobs/bronze_ingest.py
    volumes:
      - ./.secrets:/secrets:ro
    ports: ["4040:4040"]
    restart: unless-stopped
    mem_limit: 1536m
    logging: *default-logging

  spark-silver:
    # Bronze -> silver: decode, DQ, dedupe, LSN-guarded MERGE into per-table Delta.
    image: ${SILVER_IMAGE:-tidewater-spark:local}
    profiles: ["core", "all"]
    depends_on:
      spark-bronze: { condition: service_started }
      schema-registry: { condition: service_healthy }
    environment: *spark-env
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - ${SILVER_MASTER:-local[2]}
      - --driver-memory
      - 1200m
      - --conf
      - spark.ui.port=4041
      - jobs/silver_stream.py
    ports: ["4041:4041"]
    restart: unless-stopped
    mem_limit: 2g
    logging: *default-logging

  # ---------------------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["obs", "all"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["9090:9090"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    mem_limit: 384m
    logging: *default-logging

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    profiles: ["obs", "all"]
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 64m
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["obs", "all"]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Read-only anonymous viewing, so the dashboard opens without a login locally.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tidewater.json
      GRAFANA_ALERT_WEBHOOK_URL: ${GRAFANA_ALERT_WEBHOOK_URL:-http://alert-sink:9000/}
      WH_PG_USER: ${WH_PG_USER}
      WH_PG_PASSWORD: ${WH_PG_PASSWORD}
      WH_PG_DB: ${WH_PG_DB}
    ports: ["3001:3000"]
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging

  alert-sink:
    # Stand-in for Slack/Discord: logs every alert Grafana sends.
    image: python:3.11-slim
    profiles: ["obs", "all"]
    command:
      - python
      - -c
      - |
        import json, http.server
        class H(http.server.BaseHTTPRequestHandler):
            def do_POST(self):
                body = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                for a in body.get("alerts", []):
                    print(f"ALERT {a['status'].upper()}: {a['labels'].get('alertname')} - "
                          f"{a['annotations'].get('summary', '')}", flush=True)
                self.send_response(200); self.end_headers()
            def log_message(self, *args): pass
        http.server.HTTPServer(("", 9000), H).serve_forever()
    restart: unless-stopped
    mem_limit: 64m
    logging: *default-logging

  # ---------------------------------------------------------------- lineage
  marquez:
    image: marquezproject/marquez:0.50.0
    profiles: ["lineage", "all"]
    depends_on:
      postgres-wh: { condition: service_healthy }
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: postgres-wh
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      JAVA_OPTS: -Xmx384m
    ports: ["${MARQUEZ_HOST_PORT:-5005}:5000"]  # macOS AirPlay owns host port 5000
    restart: unless-stopped
    mem_limit: 768m
    logging: *default-logging

  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    profiles: ["lineage", "all"]
    depends_on: [marquez]
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    ports: ["3002:3000"]
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging

  # ---------------------------------------------------------------- orchestration
  docker-proxy:
    # Airflow launches job containers through this proxy, which exposes only the
    # container and image APIs instead of handing Airflow the full Docker socket.
    image: tecnativa/docker-socket-proxy:0.3.0
    profiles: ["orch", "all"]
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    mem_limit: 64m
    logging: *default-logging

  airflow:
    image: apache/airflow:2.10.4-python3.11
    profiles: ["orch", "all"]
    depends_on:
      postgres-wh: { condition: service_healthy }
      docker-proxy: { condition: service_started }
    command: standalone
    environment:
      <<: *spark-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-wh:5432/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW_CONN_WAREHOUSE: postgresql://${WH_PG_USER}:${WH_PG_PASSWORD}@postgres-wh:5432/${WH_PG_DB}
      TIDEWATER_DOCKER_URL: tcp://docker-proxy:2375
      TIDEWATER_NETWORK: ${COMPOSE_PROJECT_NAME}_default
    ports: ["8085:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    restart: unless-stopped
    mem_limit: 2g
    logging: *default-logging

  # ---------------------------------------------------------------- tools
  simulator:
    build: ./simulator
    profiles: ["sim"]
    environment:
      PGHOST: postgres-src
      PGPORT: 5432
      PGUSER: ${SRC_PG_USER}
      PGPASSWORD: ${SRC_PG_PASSWORD}
      PGDATABASE: ${SRC_PG_DB}
      SIM_EVENTS_PER_SEC: ${SIM_EVENTS_PER_SEC}
      SIM_SEED_CUSTOMERS: ${SIM_SEED_CUSTOMERS}
      SIM_SEED_PRODUCTS: ${SIM_SEED_PRODUCTS}
    mem_limit: 256m
    logging: *default-logging

  # ---------------------------------------------------------------- warehouse
  postgres-wh:
    image: postgres:16.4
    profiles: ["wh", "all"]
    environment:
      POSTGRES_USER: ${WH_PG_USER}
      POSTGRES_PASSWORD: ${WH_PG_PASSWORD}
      POSTGRES_DB: ${WH_PG_DB}
    ports: ["${WH_PG_HOST_PORT:-5434}:5432"]
    volumes:
      - pg-wh-data:/var/lib/postgresql/data
      - ./infra/postgres-wh/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WH_PG_USER} -d ${WH_PG_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m
    logging: *default-logging

  spark-loader:
    # Silver -> warehouse every 30 s, so live dashboard tiles move with the simulator.
    image: tidewater-spark:local
    profiles: ["wh", "all"]
    depends_on:
      postgres-wh: { condition: service_healthy }
    environment: *spark-env
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[1]
      - --driver-memory
      - 768m
      - --conf
      - spark.ui.port=4042
      - jobs/load_warehouse.py
      - --interval
      - "30"
    restart: unless-stopped
    mem_limit: 1280m
    logging: *default-logging

  dbt:
    build: ./dbt
    image: tidewater-dbt:local
    profiles: ["wh", "all"]
    depends_on:
      postgres-wh: { condition: service_healthy }
    environment:
      WH_PGHOST: postgres-wh
      WH_PGPORT: 5432
      WH_PGDATABASE: ${WH_PG_DB}
      WH_PGUSER: ${WH_PG_USER}
      WH_PGPASSWORD: ${WH_PG_PASSWORD}
      OPENLINEAGE_URL: ${OPENLINEAGE_URL:-}
      OPENLINEAGE_NAMESPACE: tidewater
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_SERVICE_USER:-SVC_TIDEWATER}
      SNOWFLAKE_PRIVATE_KEY_PATH: /secrets/snowflake_key.p8
    volumes:
      - ./dbt:/dbt
      - ./.secrets:/secrets:ro
    entrypoint: ["dbt"]
    command: ["--version"]
    mem_limit: 512m
    logging: *default-logging

  metabase:
    image: metabase/metabase:v0.50.20
    profiles: ["wh", "all"]
    depends_on:
      postgres-wh: { condition: service_healthy }
    environment:
      JAVA_OPTS: -Xmx768m
      # Keep Metabase's own app DB on a volume so dashboards survive recreation.
      MB_DB_FILE: /metabase-data/metabase.db
    ports: ["3000:3000"]
    volumes:
      - metabase-data:/metabase-data
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging

volumes:
  pg-src-data:
  pg-wh-data:
  kafka-data:
  s3-data:
  prometheus-data:
  grafana-data:
  metabase-data:
